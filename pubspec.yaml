name: gazi_portfolio_app
description: "Portfolio companion app for Gazi Monir-Uz-Zaman — offline-first, read-only."
publish_to: "none"

# Bump both numbers to publish an OTA update; the rocket launcher reads
# versionCode from the built APK's manifest.
version: 0.1.0+100

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # Networking + offline
  dio: ^5.11.1
  crypto: ^3.0.6
  package_info_plus: ^10.2.2
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  cached_network_image: ^3.4.1
  path_provider: ^2.1.6
  # Navigation + formatting
  go_router: ^17.5.0
  intl: ^0.20.3
  # Interaction
  url_launcher: ^6.3.3
  share_plus: ^13.3.1
  flutter_pdfview: ^1.4.5
  # Icons — duotone weight, matching the workspace's other Flutter apps
  phosphor_flutter: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # Offline snapshot bundled with the APK, generated by tool/generate_seed.mjs.
    # A first launch with no network shows real content instead of a blank page.
    - assets/seed.json

  # Variable fonts, shared with the web app so both clients carry the same
  # typographic voice. Registered once per family; weights are applied through
  # `fontVariations` in the theme (see lib/theme/aurora.dart).
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-Variable.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
